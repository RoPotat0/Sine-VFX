<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect your account - SineVFX</title>
<link rel="icon" href="sine.png">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:12px}
  .connect-card{max-width:360px;width:100%;background:var(--card-2);border:1px solid var(--line-2);
    border-radius:var(--r);padding:12px;text-align:center;backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .connect-card img.logo{width:124px;height:124px;border-radius:26px;margin:0;animation:none}
  #content{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
  .connect-card h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
  .connect-card p{color:var(--muted);line-height:1.5;margin:0;font-size:14px}
  .robtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    font-weight:800;height:24px;padding:0 16px;border-radius:7px;background:var(--blue);color:var(--on-blue);
    transition:filter .15s;font-size:12.5px}
  .robtn:hover{filter:brightness(1.08)}
  .robtn.disabled{opacity:.5;pointer-events:none}
</style>
</head>
<body>
  <div class="connect-card">
    <img class="logo" src="sine.png" alt="SineVFX">
    <div id="content">
      <h1>Redirecting to Roblox…</h1>
      <p>Taking you to the Roblox sign-in to confirm you own SineVFX. You'll get the Buyer role back in Discord.</p>
      <a id="go" class="robtn disabled" href="#">Continue with Roblox</a>
    </div>
  </div>

<script>
(function () {
  var cfg = (window.SVFX_CONFIG && window.SVFX_CONFIG.connect) || {};
  var params = new URLSearchParams(location.search);
  var token = params.get("token");
  var content = document.getElementById("content");

  function fail(title, msg) {
    content.innerHTML = "<h1>" + title + "</h1><p>" + msg + "</p>";
  }

  if (!token) {
    fail("This link is invalid", "Head back to Discord and click <b>Connect your account(s)</b> to get a fresh link.");
    return;
  }
  if (!cfg.robloxClientId || !cfg.workerUrl) {
    fail("Not set up yet", "The connect flow isn't configured. If you're the admin, fill in <code>connect.robloxClientId</code> and <code>connect.workerUrl</code> in config.js.");
    return;
  }

  // Build the official Roblox login URL. redirect_uri points at our own site's callback page,
  // which hands the code to the Worker for the secret swap + ownership check.
  var url = "https://apis.roblox.com/oauth/v1/authorize"
    + "?client_id=" + encodeURIComponent(cfg.robloxClientId)
    + "&redirect_uri=" + encodeURIComponent(location.origin + "/callback.html")
    + "&scope=" + encodeURIComponent("openid profile user.inventory-item:read")
    + "&response_type=code"
    + "&state=" + encodeURIComponent(token);

  var go = document.getElementById("go");
  go.href = url;
  go.classList.remove("disabled");
  go.textContent = "Continue with Roblox";

  // Go straight to Roblox OAuth. The visible button is only a fallback for the
  // rare case a browser blocks the auto-redirect. replace() keeps this page out
  // of history so Back doesn't bounce the user through it again.
  location.replace(url);
})();
</script>
</body>
</html>
